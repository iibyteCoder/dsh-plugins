name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No dependencies to cache, and pnpm is intentionally not installed.
          package-manager-cache: false
      - name: Run tests
        # Run inside the package so Node's default test discovery picks up the
        # same files as `node --test` does locally. Passing the test directory
        # as an argument is not portable: Node 22.23 treats it as a module.
        working-directory: packages/session-hub
        run: node --test
